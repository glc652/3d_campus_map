<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163a43"><meta name="description" content="根据校园布局与实景照片绘制的浙大城市学院交互式 3D 校园示意地图。"><title>浙大城市学院 · 3D 校园地图</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body>
<header><div class="brandmark">城</div><div><h1>浙大城市学院</h1><p>CAMPUS ATLAS <span>交互式校园地图</span></p></div><div class="header-right"><span class="edition">3D · 建筑细化版</span><button id="reference" class="quiet">查看原始布局</button><button id="menu" class="quiet" aria-expanded="false" aria-controls="sidebar">建筑目录</button></div></header>
<main><aside id="sidebar"><div class="aside-head"><span class="eyebrow">EXPLORE THE CAMPUS</span><h2>从这里，认识校园。</h2><p>选择一栋建筑，开始探索。</p></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索图书馆、教学楼、食堂…" aria-label="搜索校园建筑"><kbd>/</kbd></label><div id="filters" class="filters" aria-label="建筑类型筛选"></div><div class="list-heading"><span id="resultCount"></span><span>点击定位 ↗</span></div><div id="buildingList" class="building-list"></div><div class="aside-footer"><span class="pin">◎</span><div>南北两区 · 一座校园<small>结合校园总图与官网照片绘制</small></div></div></aside>
<section id="viewport" aria-label="可交互三维校园地图"><div id="canvasMount"></div><div id="labels"></div><div class="map-top"><div class="segmented" aria-label="校区视图"><button data-view="all" class="active">全景</button><button data-view="north">北校区</button><button data-view="south">南校区</button></div><span class="map-tip">拖动旋转 · 滚轮缩放 · 右键平移</span></div><div id="loading">正在搭建校园…</div><div class="compass" aria-label="示意图上方为北"><div id="compassNeedle">N<br><span>▲</span></div></div><div id="detail" class="detail" hidden></div><div class="map-bottom"><div class="view-tools"><button id="reset" title="回到全景">⌂ <span>全景</span></button><button id="top" title="切换俯视" aria-pressed="false">▦ <span>俯视</span></button><button id="toggleLabels" aria-pressed="true">Aa <span>标注</span></button><button id="rotate" aria-pressed="false">⟳ <span>环绕</span></button><span class="divider"></span><button id="recordTour" title="录制中文介绍视频">● <span>录屏</span></button><button id="export" title="下载可在 Blender 中打开的 GLB 模型">↓ <span>模型</span></button></div><div class="zoom"><button id="zoomIn" aria-label="放大地图">＋</button><button id="zoomOut" aria-label="缩小地图">−</button></div></div><div id="toast" role="status" aria-live="polite"></div><div class="map-credit">ZUCC / 城市与校园 <span>位置、体量仅供展示，不用于测绘或路线导航</span></div></section></main>
<dialog id="referenceDialog"><div class="dialog-title"><div><h2>校园布局参考</h2><p>你提供的校园示意图与鸟瞰图</p></div><button id="closeReference" aria-label="关闭参考图">×</button></div><div class="ref-tabs"><button data-ref="campus-plan.jpg" class="active">校园示意图</button><button data-ref="aerial.jpg">鸟瞰图</button></div><div class="reference-image"><img id="refImage" src="assets/campus-plan.jpg" alt="用户提供的校园示意图"></div></dialog>
<script type="module" src="app.js"></script></body></html>
